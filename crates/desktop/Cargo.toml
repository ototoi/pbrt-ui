[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "GPUI desktop editor with movable Dock panels and an offscreen scene viewport."

[[bin]]
name = "pbrt-ui"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dependencies]
protocol = { workspace = true }
project = { workspace = true }
app-core = { package = "core", path = "../core" }
scene-view = { path = "../scene-view" }
scene-parse = { workspace = true }
spectrum = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
futures-channel = "0.3"
sha2 = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
# Pin the facade and pre-release UI dependencies to compatible versions.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "e949d3e5d42c749f02add3c12c3615744cad3938" }

[dev-dependencies]
tempfile = "3"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "inhibit", "open_uri", "file_chooser", "settings"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
