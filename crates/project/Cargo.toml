[package]
name = "project"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Persistent native scene model, atomic editing and folder-based project storage."

[dependencies]
protocol = { workspace = true }
# `rc` serializes `Arc<SceneDocument>` as its value (project model only).
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
uuid = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tempfile = "3"
libc = "0.2"

